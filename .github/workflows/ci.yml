name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    # The tests run on real Postgres (architecture 2), like the local Docker database.
    services:
      db:
        image: postgres:17-alpine
        env:
          # Throwaway credentials for this CI container only.
          POSTGRES_USER: kitty
          POSTGRES_PASSWORD: kitty
          POSTGRES_DB: kitty
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kitty -d kitty"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://kitty:kitty@localhost:5432/kitty_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
